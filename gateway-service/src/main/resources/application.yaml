spring:
  application:
    name: gateway-service

server:
  port: 8081

llm:
  provider:
    ollama:
      base-url: http://localhost:11434/v1/chat/completions
      model: llama3.2:1b
    groq:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1/chat/completions
      model: llama-3.1-8b-instant
    primary: ollama