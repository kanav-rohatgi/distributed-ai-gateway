server:
  port: 8081

spring:
  application:
    name: gateway-service
  config:
    import: "configserver:http://localhost:8888"
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true