spring:
  application:
    name: gateway-service

server:
  port: 8081

llm:
  provider:
    ollama:
      base-url: http://localhost:11434/v1/chat/completions
      model: llama3.2:1b
    groq:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1/chat/completions
      model: llama-3.1-8b-instant
    primary: ollama

ratelimit:
  capacity: 5
  refill-rate-per-second: 0.0167   # ≈ 1 token per minute — deliberately low to see 429s while testing