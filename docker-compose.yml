services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - gateway-net

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kanav007
      POSTGRES_DB: cost_tracking
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gateway-net

  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - gateway-net

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    restart: on-failure
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo:ro
    environment:
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:///config-repo
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - gateway-net

  cost-tracking-service:
    build: ./cost-tracking-service
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cost_tracking
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      LLM_PROVIDER_OLLAMA_BASE_URL: http://host.docker.internal:11434/v1/chat/completions
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is not set}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - gateway-net

  gateway-1:
    build: ./gateway-service
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cost_tracking
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is not set}
      LLM_PROVIDER_OLLAMA_BASE_URL: http://host.docker.internal:11434/v1/chat/completions
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      cost-tracking-service:
        condition: service_started
    networks:
      - gateway-net

  gateway-2:
    build: ./gateway-service
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cost_tracking
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is not set}
      LLM_PROVIDER_OLLAMA_BASE_URL: http://host.docker.internal:11434/v1/chat/completions
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      cost-tracking-service:
        condition: service_started
    networks:
      - gateway-net

  gateway-3:
    build: ./gateway-service
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cost_tracking
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is not set}
      LLM_PROVIDER_OLLAMA_BASE_URL: http://host.docker.internal:11434/v1/chat/completions
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      cost-tracking-service:
        condition: service_started
    networks:
      - gateway-net

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge