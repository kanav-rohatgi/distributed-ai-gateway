# docker-compose.yml — place at distributed-ai-gateway/ root
version: '3.8'

services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - gateway-net

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: kanav007
      POSTGRES_DB: cost_tracking
    ports:
      - "5432:5432"
    networks:
      - gateway-net

  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    networks:
      - gateway-net

  config-server:
    build: ./config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:///config-repo
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    depends_on:
      - eureka-server
    networks:
      - gateway-net

  cost-tracking-service:
    build: ./cost-tracking-service
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cost_tracking
    depends_on:
      - postgres
      - eureka-server
      - config-server
    networks:
      - gateway-net

  gateway-1:
    build: ./gateway-service
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cost_tracking
      LLM_PROVIDER_OLLAMA_BASE-URL: http://host.docker.internal:11434/v1/chat/completions
    depends_on:
      - redis
      - postgres
      - eureka-server
      - config-server
      - cost-tracking-service
    networks:
      - gateway-net

  gateway-2:
    build: ./gateway-service
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cost_tracking
      LLM_PROVIDER_OLLAMA_BASE-URL: http://host.docker.internal:11434/v1/chat/completions
    depends_on:
      - redis
      - postgres
      - eureka-server
      - config-server
      - cost-tracking-service
    networks:
      - gateway-net

  gateway-3:
    build: ./gateway-service
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cost_tracking
      LLM_PROVIDER_OLLAMA_BASE-URL: http://host.docker.internal:11434/v1/chat/completions
    depends_on:
      - redis
      - postgres
      - eureka-server
      - config-server
      - cost-tracking-service
    networks:
      - gateway-net

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge